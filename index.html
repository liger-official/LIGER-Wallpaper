<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIGER Wallpaper</title>
<style>
body{background:#000;color:#fff;text-align:center;font-family:sans-serif;margin:0;padding:10px}
h2{letter-spacing:1px}
input{width:90%;padding:15px;border-radius:12px;border:0;font-size:16px;margin-top:10px}
button{width:92%;padding:14px;margin-top:12px;background:#00ff88;border:0;border-radius:12px;font-weight:bold;font-size:16px}
#box{display:flex;flex-wrap:wrap;justify-content:center;margin-top:15px;gap:8px}
#box img{width:48%;border-radius:15px;height:320px;object-fit:cover;background:#111}
</style>
</head>
<body>
<h2>LIGER AI WALLPAPER</h2>
<input id="q" placeholder="Alphabet, whatsapp, A, B, nature">
<button onclick="go()">SEARCH</button>
<div id="box"></div>
<script>
function go(){
let q=document.getElementById('q').value.trim() || "wallpaper";
if(q.toLowerCase().includes("what app") || q.toLowerCase().includes("whatsapp")) q="whatsapp logo dark";
if(q.toLowerCase().length==1) q="letter "+q+" 3d wallpaper dark";
let html="";
for(let i=1;i<=12;i++){
let seed = encodeURIComponent(q+"-"+i+"-"+Date.now());
html+=`<img src="https://picsum.photos/seed/${seed}/400/800" loading="lazy" onclick="window.open(this.src,'_blank')">`;
}
document.getElementById('box').innerHTML=html;
}
go();
</script>
</body>
</html>

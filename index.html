<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIGER</title>
<style>
body{margin:0;padding:10px;background:#ffb6d9;text-align:center;font-family:sans-serif}
h2{background:#fff;padding:12px;border-radius:20px;color:#ff2e8a}
input{width:92%;padding:15px;border-radius:25px;border:0}
button.search{width:92%;padding:14px;margin-top:10px;background:#ff2e8a;color:#fff;border:0;border-radius:25px;font-weight:bold}
#box{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:15px}
.card{width:48%;background:#fff;border-radius:15px;overflow:hidden;position:relative;border:2px solid #fff;box-shadow:0 5px 15px rgba(0,0,0,0.3)}
.card img{width:100%;height:320px;object-fit:cover;display:block}
.card .dl{position:absolute;top:6px;right:6px;background:#ff2e8a;color:#fff;border:0;border-radius:50%;width:38px;height:38px}
.footer{margin-top:15px;background:#000;color:#fff;padding:10px;border-radius:10px}
</style>
</head>
<body>
<h2>💖 LIGER AI WALLPAPER 🌸</h2>
<input id="q" placeholder="TYPE...">
<button class="search" onclick="go()">🌸 SEARCH 🌺</button>
<div id="box"></div>
<div class="footer">POWERED BY LIGER ⚡</div>
<script>
function go(){
let q=document.getElementById('q').value.trim() || "girl";
let box=document.getElementById('box');
box.innerHTML="";
for(let i=0;i<12;i++){
let seed = encodeURIComponent(q+"-"+i);
let url = `https://picsum.photos/seed/${seed}/600/1000`;
box.innerHTML+=`<div class="card"><img src="${url}"><button class="dl" onclick="window.open('${url}')">⬇</button></div>`;
}
}
go();
</script>
</body>
</html>

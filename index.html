.card .dl{position:absolute;top:8px;right:8px;background:#ff2e8a;color:#fff;border:0;border-radius:50%;width:40px;height:40px;font-size:18px}
.card .dl2{position:absolute;bottom:0;left:0;width:100%;background:linear-gradient(transparent, rgba(0,0,0,0.8));color:#fff;border:0;padding:10px;font-weight:bold}
.footer{margin-top:20px;background:#000;color:#fff;padding:12px;border-radius:12px;font-weight:bold}

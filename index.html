<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIGER Wallpaper</title>
<style>
body{margin:0;padding:10px;background:linear-gradient(135deg,#ff9a9e,#fecfef,#ff6eb7);min-height:100vh;font-family:sans-serif;text-align:center}
h2{background:#fff;padding:12px;border-radius:20px;color:#ff2e8a}
input{width:92%;padding:16px;border-radius:25px;border:0;font-size:16px}
button.search{width:92%;padding:14px;margin-top:12px;background:#ff2e8a;color:#fff;border:0;border-radius:25px;font-weight:bold;font-size:17px}
#box{display:flex;flex-wrap:wrap;justify-content:center;margin-top:15px;gap:12px}
.card{width:48%;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 8px 25px rgba(0,0,0,0.3);position:relative;border:2px solid white}
.card img{width:100%;height:340px;object-fit:cover;display:block;background:#ffe6f0}
.card .dl{position:absolute;top:8px;right:8px;background:rgba(255,46,138,0.95);color:#fff;border:0;border-radius:50%;width:42px;height:42px;font-size:20px;font-weight:bold;box-shadow:0 4px 10px rgba(0,0,0,0.3)}
.card .dl2{position:absolute;bottom:0;left:0;width:100%;background:linear-gradient(transparent, rgba(0,0,0,0.8));color:#fff;border:0;padding:12px 5px;font-weight:bold;font-size:13px}
.footer{margin-top:20px;background:rgba(0,0,0,0.85);color:#fff;padding:14px;border-radius:15px;font-weight:bold}
</style>
</head>
<body>
<h2>💖 LIGER AI WALLPAPER 🌸</h2>
<input id="q" placeholder="KESA WALLPAPER CHYEA...!">
<button class="search" onclick="go()">🌸 SEARCH 🌺</button>
<div id="box"></div>
<div class="footer">POWERED BY LIGER ⚡</div>
<script>
function go(){
let q=document.getElementById('q').value.trim() || "beautiful girl";
let box=document.getElementById('box');
box.innerHTML="<h3 style='color:white'>✨ AI bana raha hai...</h3>";
let html="";
for(let i=1;i<=12;i++){
let prompt=q.length==1?`3d letter ${q.toUpperCase()} wallpaper pink flowers hd` : `${q} wallpaper beautiful hd 4k aesthetic`;
let url=`https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=600&height=1000&seed=${i+Math.floor(Math.random()*10000)}&nologo=true`;
html+=`<div class="card"><img src="${url}" loading="lazy"><button class="dl" onclick="window.open('${url}','_blank')">⬇</button><button class="dl2" onclick="window.open('${url}','_blank')">DOWNLOAD</button></div>`;
}
box.innerHTML=html;
}
go();
</script>
</body>
</html>

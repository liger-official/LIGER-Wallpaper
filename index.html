<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>LIGER Wallpaper</title>
<style>body{background:#000;color:#fff;text-align:center;font-family:sans-serif}input{width:85%;padding:14px;border-radius:10px;margin-top:20px}button{padding:12px;width:85%;margin-top:10px;background:#00ff88;border:0;border-radius:10px;font-weight:bold}img{width:48%;margin:1%;border-radius:12px;height:250px;object-fit:cover}</style></head>
<body>
<h3>LIGER AI WALLPAPER</h3>
<input id="q" placeholder="Likho: A, B, whatsapp, nature">
<button onclick="go()">SEARCH</button>
<div id="box" style="margin-top:15px"></div>
<script>
function go(){
let a=document.getElementById('q').value;
if(a==""){a="beautiful mobile wallpaper"}
let b="";
for(let i=0;i<12;i++){
b+=`<img src="https://source.unsplash.com/400x800/?${a},wallpaper,${i}" onclick="window.open(this.src)">`;
}
document.getElementById('box').innerHTML=b;
}
go();
</script></body></html>

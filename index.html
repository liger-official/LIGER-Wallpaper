<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>LIGER</title>
<style>
body{margin:0;padding:8px;background:#ffb6d9;text-align:center;font-family:sans-serif}
h2{background:#fff;padding:10px;border-radius:15px;color:#ff2e8a;font-size:18px;margin:5px}
input{width:90%;padding:12px;border-radius:20px;border:0}
button.search{width:90%;padding:12px;margin-top:8px;background:#ff2e8a;color:#fff;border:0;border-radius:20px;font-weight:bold}
#box{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:10px}
.card{width:47%;background:#fff;border-radius:15px;overflow:hidden;position:relative;box-shadow:0 3px 8px rgba(0,0,0,0.2)}
.card img{width:100%;height:220px;object-fit:cover;display:block}
.card .down{position:absolute;bottom:0;left:0;width:100%;background:#ff2e8a;color:#fff;border:0;padding:9px;font-weight:bold;font-size:13px}
.footer{margin-top:10px;background:#000;color:#fff;padding:8px;border-radius:8px;font-size:12px}
</style>
</head>
<body>
<h2>💖 LIGER AI WALLPAPER 🌸</h2>
<input id="q" placeholder="TYPE...">
<button class="search" onclick="go()">🌸 SEARCH 🌺</button>
<div id="box"></div>
<div class="footer">POWERED BY LIGER ⚡</div>
<script>
function go(){
let raw=document.getElementById('q').value.trim()||"liger";
let q=raw.toLowerCase().replace(/[^a-z0-9]/g,"");
let box=document.getElementById('box');
box.innerHTML="";
let t=Date.now();
for(let i=0;i<12;i++){
let url=`https://picsum.photos/seed/${q}${i}${t}/300/400`;
box.innerHTML+=`<div class="card"><img src="${url}" loading="eager"><button class="down" onclick="window.open('https://picsum.photos/seed/${q}${i}${t}/1080/1920')">⬇ DOWNLOAD</button></div>`;
}
}
go();
</script>
</body>
</html>
